# akldb's own CI (docs/decisions/07-implementation-phase1.md §7; this repo was cut from the
# site's tree on 2026-09-13, db/ is now the root). Runs
# independently of the site's gate.yml/build.yml -- db/ has its own
# package.json and moves to its own repo eventually (00-plan.md §7), so its
# CI moves with it. `test` lands in S1; `deploy` (S7, needs: test, main-push
# only) and the daily rehost/diff-upstream job (S7/S8) land here -- both
# checked by tests/tools/ciwiring.test.ts.
name: db

on:
  pull_request:
    paths:
      - "**"
  push:
    # main, plus the layoutdb integration branch `ldb-arch-review` (2026-09-12):
    # a push there runs the tests and then the pr-deploy job below, which
    # deploys the ONE layoutdb, prod akl-db. Other branches ride pull_request.
    branches: [main, ldb-arch-review]
    paths:
      - "**"
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily (07 §7) -- the `daily` job
  workflow_dispatch: {}

jobs:
  test:
    # The scheduled run is reserved for `daily` below. PR/push CI already
    # covers this suite; rerunning all ~15k tests nightly only wastes runner
    # time and can send an unrelated failure notification for a healthy
    # backup/rehost run.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: frozen.test.ts (S2) diffs against origin/main to
      # enforce LDB-F6 (merged format majors are immutable) -- a shallow
      # checkout has no origin/main to diff against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # Push to main only: apply migrations, then deploy. Same order a rehost
  # uses (07 §6 S7) -- a deploy never ships code expecting a column/table a
  # freshly-created remote D1 (or one behind on migrations) doesn't have yet.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: db-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply akl-db --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DB_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DB_ACCOUNT_ID }}

  # A push to the layoutdb integration branch (`ldb-arch-review`, since the
  # 2026-09-12 architecture review; was the layout-db-pr PR) deploys the ONE
  # layoutdb, prod `akl-db` (saltorbit 2026-09-11: "everything should point to
  # the production layoutdb"; 2026-09-12: "keep pushing to prod layoutdb").
  # Records a D1 time-travel bookmark first (the rollback point, printed in
  # the log), then migrations, then the Worker -- the same order as
  # `deploy`. Serialized with `deploy` so two runs never interleave.
  pr-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/ldb-arch-review'
    concurrency:
      group: db-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Record the D1 rollback bookmark
        run: npx wrangler d1 time-travel info akl-db --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DB_ACCOUNT_ID }}
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply akl-db --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DB_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DB_ACCOUNT_ID }}

  # akldb.org's own Worker (design/akldb-site/01-plan.md §6, W1a). Its own
  # package.json under db/site/ -- `paths: db/**` above already covers it,
  # no trigger edit needed. Typechecks, tests and builds on every PR/push;
  # `site-deploy` below is the only thing that ships it.
  site:
    # No `needs: test`: the site has its own typecheck/test/build gate below
    # and shares no code with the Worker (LDB-G5 forbids it). Like `test`,
    # this is PR/push CI, not part of the scheduled live-data proof. The
    # schedule should launch only `daily` below.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # A push to main deploys akldb.org -- only once BOTH its own gate (`site`)
  # and the API's (`deploy`, which itself needs the db `test` suite) have
  # passed (saltorbit 2026-09-28: "deploy site only if tests etc work"), so
  # the site never ships ahead of, or without, the API it calls. Until
  # 2026-09-28 this was a step inside `site` gated on the retired
  # `ldb-arch-review` branch, so no push to main shipped the site at all.
  # Its own concurrency group (`akldb-site-deploy`, not `db-prod-deploy`):
  # the two Workers are independent deploys and must never block each
  # other, only themselves. Rebuilds from the same commit rather than
  # passing `dist/` between jobs -- the build is seconds.
  site-deploy:
    needs: [site, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: akldb-site-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DB_ACCOUNT_ID }}

  # `schedule`/`workflow_dispatch` only (never on a PR/push) -- real network
  # against the deployed service, on ${{ vars.DB_BASE_URL }} (a repo/org
  # variable naming the live origin, e.g. https://akl-db.<account>.workers.dev).
  # Both steps fail loudly on any problem; neither is allowed to skip
  # silently (07 §6 S8: "a skip nobody reads is a pass").
  daily:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # LDB-C6 (audit-db.md §H item 4, C.3): a copy of the live dump OFF
      # Cloudflare -- free, 30-day retention -- before anything else touches
      # it, so a corrupt/failed rehost drill below still leaves this run's
      # artifact behind to diagnose from or restore from by hand.
      - name: Fetch the live dump (off-account copy)
        run: |
          set -euo pipefail
          latest_json=$(curl -sf "${{ vars.DB_BASE_URL }}/v1/dump/latest.json")
          echo "$latest_json" > latest.json
          rel_url=$(echo "$latest_json" | jq -r .url)
          curl -sf "${{ vars.DB_BASE_URL }}${rel_url}" -o dump.json.gz
      - name: Upload the dump artifact (LDB-C6, 30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: layoutdb-dump-${{ github.run_id }}
          path: |
            latest.json
            dump.json.gz
          retention-days: 30
      - name: Rehost drill against the live dump (LDB-G1)
        run: |
          set -euo pipefail
          rel_url=$(jq -r .url latest.json)
          REHOST_DUMP_URL="${{ vars.DB_BASE_URL }}${rel_url}" npx vitest run tests/rehost.test.ts --project workers
      - name: Upstream diff (LDB-P5, S8)
        # LDB-I27 (saltorbit, 2026-09-15: "pine has taken down his api"):
        # cmini's own upstream (https://clemenpine.com/layoutapi/v3) was
        # taken down by its owner -- this step calls it directly over real
        # HTTP (outside the Worker's own IMPORT_ENABLED env entirely), so it
        # is gated here instead. Flip back to `if: true` (or delete this
        # line) once the upstream answers again; see INVARIANTS.md's
        # LDB-I27 row and wrangler.toml's own IMPORT_ENABLED switch.
        if: false
        run: |
          set -euo pipefail
          DB_BASE_URL="${{ vars.DB_BASE_URL }}" npx vitest run tests/upstream-diff.test.ts --project node
