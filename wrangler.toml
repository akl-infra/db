name = "akl-db"
main = "src/index.ts"
compatibility_date = "2026-08-22" # newest date the installed workerd/miniflare (wrangler ^4.130.0) supports as of this writing; bump when the toolchain does
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "akl-db"
database_id = "53f596d5-9cb5-43b0-9026-17518d18052f" # account "akl" (58a5eb82…), created 2026-09-09

[[r2_buckets]]
binding = "DUMPS"
bucket_name = "akl-db-dumps"

[triggers]
crons = ["*/5 * * * *"] # ONE trigger for three jobs -- src/index.ts's scheduled() dispatches by event.scheduledTime, not event.cron

[vars]
IMPORT_SOURCE_URL = "https://clemenpine.com/layoutapi/v3"
IMPORT_MAX_WRITES_PER_TICK = "500"
IMPORT_UA = "akl-db-import/1.0"
DISCORD_API_URL = "https://discord.com/api"

[observability]
enabled = true   # Workers Logs: keep console.error() from onError (the 500 path) queryable in the dashboard; 2026-09-09, after two untraceable 500s

# There is one layoutdb, production (design/layout-db/review/PROPOSAL.md
# §2.1, LEDGER.md L4). The preview environment (`akl-db-preview`) was
# retired 2026-09-11 -- nothing read it and it accepted no clients; H13
# says one layoutdb. Do not re-add an `[env.preview]` block without a real
# consumer.
